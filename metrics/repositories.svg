<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" preserveAspectRatio="xMidYMid meet" aria-labelledby="repositories-title repositories-desc">
  <!--
    Component : repositories
    Purpose   : generated from the GitHub API by generate-metrics.sh
    Author    : Erick Okello
    Version   : 1.3
    Dependencies : curl, jq
  -->
  <title id="repositories-title">Top repositories</title>
  <desc id="repositories-desc">Top four repositories sorted by stargazers, excluding forks. Each row shows rank, name, language, description, stars and forks.</desc>
  <style>
    :root {
      --bg: #050816;
      --panel: #0B1020;
      --accent: #00F5FF;
      --text: #F5F7FA;
      --muted: #8A98B5;
      --divider: #1D2638;
      --healthy: #00FF9D;
      --warning: #FFB020;
      --critical: #FF5C5C;
      --font: 'JetBrains Mono', 'IBM Plex Mono', monospace;
    }
    svg { font-family: var(--font); }

    .bg      { fill: var(--bg); }
    .panel   { fill: var(--panel); }
    .text    { fill: var(--text); }
    .muted   { fill: var(--muted); }
    .accent  { fill: var(--accent); }
    .healthy { fill: var(--healthy); }
    .warning { fill: var(--warning); }
    .divider { fill: var(--divider); }
    .stroke-div { stroke: var(--divider); }

    @keyframes load {
      0% { transform: scaleX(0); }
      45% { transform: scaleX(1); }
      55% { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .load { transform-box: fill-box; transform-origin: left center; animation: load 3.6s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1s ease both; }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="400"/>
  <text class="accent" x="48" y="36" font-size="13" letter-spacing="2">// TOP REPOSITORIES</text>

  <rect class="panel stroke-div" x="48" y="48" width="1104" height="304" rx="8"/>
  <g class="metric">

    <text class="muted" x="84" y="120" font-size="13">01</text>
    <text class="text" x="128" y="112" font-size="16">E-Okelloh</text>
    <circle cx="130" cy="132" r="4" fill="#8A98B5"/>
    <text class="muted" x="146" y="136" font-size="13">OTHER</text>
    <text class="muted" x="1128" y="112" text-anchor="end" font-size="13">STAR 2 · FORK 0</text>
    <text class="muted" x="128" y="136" font-size="13" opacity="0.85">Config files for my GitHub profile.</text>
    <rect class="divider" x="84" y="152" width="1028" height="1"/>
    <text class="muted" x="84" y="188" font-size="13">02</text>
    <text class="text" x="128" y="180" font-size="16">AWS_Agentic_AI</text>
    <circle cx="130" cy="200" r="4" fill="#3776AB"/>
    <text class="muted" x="146" y="204" font-size="13">Python</text>
    <text class="muted" x="1128" y="180" text-anchor="end" font-size="13">STAR 1 · FORK 0</text>
    <text class="muted" x="128" y="204" font-size="13" opacity="0.85">no description available</text>
    <rect class="divider" x="84" y="220" width="1028" height="1"/>
    <text class="muted" x="84" y="256" font-size="13">03</text>
    <text class="text" x="128" y="248" font-size="16">Coin</text>
    <circle cx="130" cy="268" r="4" fill="#7D9AF8"/>
    <text class="muted" x="146" y="272" font-size="13">Move</text>
    <text class="muted" x="1128" y="248" text-anchor="end" font-size="13">STAR 1 · FORK 0</text>
    <text class="muted" x="128" y="272" font-size="13" opacity="0.85">no description available</text>
    <rect class="divider" x="84" y="288" width="1028" height="1"/>
    <text class="muted" x="84" y="324" font-size="13">04</text>
    <text class="text" x="128" y="316" font-size="16">Market-place-Contracts</text>
    <circle cx="130" cy="336" r="4" fill="#3178C6"/>
    <text class="muted" x="146" y="340" font-size="13">TypeScript</text>
    <text class="muted" x="1128" y="316" text-anchor="end" font-size="13">STAR 1 · FORK 1</text>
    <text class="muted" x="128" y="340" font-size="13" opacity="0.85">no description available</text>
  </g>

  <text class="muted" x="48" y="380" font-size="13">// SORTED BY STARGAZERS | NON-FORK ONLY</text>
</svg>
