name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate metric panels
        run: bash .github/scripts/generate-metrics.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit metrics if changed
        run: |
          git config user.name "gpos-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/metrics.svg metrics/repositories.svg metrics/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile metrics"
            git push
          fi