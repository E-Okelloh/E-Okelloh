name: Update Sync Timestamps

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh last-sync stamp
        run: |
          stamp="$(date -u +%d.%m.%y\ %H:%M)"
          sed -E -i \
            -e 's/LAST UPDATED [0-9]{2}\.[0-9]{2}\.[0-9]{2} [0-9]{2}:[0-9]{2}/LAST UPDATED '"${stamp}"'/' \
            -e 's/LAST UPDATED \{\{LAST_UPDATED\}\}/LAST UPDATED '"${stamp}"'/' \
            assets/dashboard.svg

      - name: Commit stamp if changed
        run: |
          git config user.name "gpos-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh last sync stamp"
            git push
          fi