name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=00FF9D&color_dots=0B1020,13303C,1D5A66,00808F,00F5FF

      - name: Commit snake if changed
        run: |
          if [ -f assets/snake.svg ]; then
            git config user.name "gpos-bot[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/snake.svg
            if ! git diff --cached --quiet; then
              git commit -m "chore: refresh contribution snake"
              git push
            fi
          fi