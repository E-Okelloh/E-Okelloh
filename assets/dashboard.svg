<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2648" viewBox="0 0 1200 2648" role="img" preserveAspectRatio="xMidYMid meet" aria-labelledby="dash-title dash-desc">
  <!--
    Component : dashboard
    Purpose   : compound control center — header, system status, network topology,
                deployments, capabilities, and operations panel
    Author    : Erick Okello
    Version   : 1.3
    Dependencies : none
  -->
  <title id="dash-title">Financial Infrastructure Dashboard</title>
  <desc id="dash-desc">Operational control center. Identity header, system status, payment routing topology with animated packets, deployments, capabilities, observability panel, and build metadata.</desc>

  <style>
    :root {
      --bg:       #050816;
      --panel:    #0B1020;
      --accent:   #00F5FF;
      --text:     #F5F7FA;
      --muted:    #8A98B5;
      --divider:  #1D2638;
      --healthy:  #00FF9D;
      --warning:  #FFB020;
      --critical: #FF5C5C;
      --font: 'JetBrains Mono', 'IBM Plex Mono', monospace;
    }
    svg { font-family: var(--font); }

    .bg      { fill: var(--bg); }
    .panel   { fill: var(--panel); }
    .text    { fill: var(--text); }
    .muted   { fill: var(--muted); }
    .accent  { fill: var(--accent); }
    .healthy { fill: var(--healthy); }
    .warning { fill: var(--warning); }
    .critical{ fill: var(--critical); }
    .divider { fill: var(--divider); }
    .stroke-acc   { stroke: var(--accent); }
    .stroke-panel { stroke: var(--panel); }
    .stroke-div   { stroke: var(--divider); }
    .stroke-ok    { stroke: var(--healthy); }

    @keyframes fadein    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes nodepulse {
      0%,100% { opacity: 0.85; transform: scale(1); }
      50%     { opacity: 1; transform: scale(1.03); }
    }
    @keyframes statusrefresh { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1280px); } }
    @keyframes packet {
      0%   { transform: translate(0, 0); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
    }
    @keyframes blink-caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .fadein  { animation: fadein 250ms ease both; }
    .caret   { animation: blink-caret 700ms step-end infinite; }
    .scanline{ animation: scan 4.5s linear infinite; }
    .pulse-node { transform-box: fill-box; transform-origin: center;
                 animation: nodepulse 3s ease-in-out infinite; }
    .pulse-status { animation: statusrefresh 3.6s ease-in-out infinite; }
    .packet  { will-change: transform; animation: packet var(--dur) ease-in-out infinite; }
  </style>

  <!-- ===================== layer: defs ===================== -->
  <defs></defs>

  <!-- ===================== background ===================== -->
  <rect id="dashboard-root" class="bg" x="0" y="0" width="1200" height="2648"/>

  <!-- ===================== header-root ===================== -->
  <g id="header-root" class="fadein" text-anchor="middle">
    <text class="accent" y="170" font-size="13" letter-spacing="3">// FINANCIAL INFRASTRUCTURE ENGINEER</text>
    <text class="text" y="246" font-size="56" font-weight="700" letter-spacing="6">ERICK OKELLO</text>
    <text class="muted" y="300" font-size="16" letter-spacing="1">BUILDING INFRASTRUCTURE THAT MOVES VALUE SECURELY AT GLOBAL SCALE.</text>
    <rect class="accent caret" x="1064" y="286" width="12" height="18"/>
  </g>
  <rect class="divider" x="0" y="348" width="1200" height="1"/>
  <rect class="accent scanline" x="0" y="345" width="180" height="4" opacity="0.5"/>

  <!-- ===================== status-root ===================== -->
  <g id="status-root">
    <text class="accent" x="48" y="410" font-size="13" letter-spacing="2">// SYSTEM STATUS</text>

    <g font-size="16">
      <rect id="status-indicator" class="healthy pulse-status" x="48" y="440" width="4" height="16"/>
      <text class="muted" x="76" y="452">Infrastructure</text>
      <text class="healthy" x="1152" y="452" text-anchor="end">ONLINE</text>

      <rect class="healthy pulse-status" x="48" y="480" width="4" height="16" style="animation-delay:0.4s"/>
      <text class="muted" x="76" y="492">Payments</text>
      <text class="healthy" x="1152" y="492" text-anchor="end">ROUTING</text>

      <rect class="healthy pulse-status" x="48" y="520" width="4" height="16" style="animation-delay:0.8s"/>
      <text class="muted" x="76" y="532">Blockchain</text>
      <text class="healthy" x="1152" y="532" text-anchor="end">ACTIVE</text>

      <rect class="healthy pulse-status" x="48" y="560" width="4" height="16" style="animation-delay:1.2s"/>
      <text class="muted" x="76" y="572">Open Source</text>
      <text class="healthy" x="1152" y="572" text-anchor="end">RUNNING</text>

      <rect class="healthy pulse-status" x="48" y="600" width="4" height="16" style="animation-delay:1.6s"/>
      <text class="muted" x="76" y="612">Availability</text>
      <text class="healthy" x="1152" y="612" text-anchor="end">READY</text>
    </g>
    <rect class="divider" x="48" y="648" width="1104" height="1"/>
  </g>

  <!-- ===================== network-root ===================== -->
  <g id="network-root">
    <text class="accent" x="48" y="694" font-size="13" letter-spacing="2">// NETWORK TOPOLOGY</text>

    <!-- connections -->
    <g class="connection" fill="none">
      <line class="stroke-acc" x1="600" y1="754" x2="600" y2="834" stroke-width="2"/>
      <line class="stroke-acc" x1="600" y1="754" x2="600" y2="834" stroke-width="1" opacity="0.35"/>
      <line class="stroke-div" x1="600" y1="834" x2="600" y2="914" stroke-width="2"/>
      <line class="stroke-acc" x1="600" y1="834" x2="600" y2="914" stroke-width="1" opacity="0.35"/>
      <line class="stroke-div" x1="600" y1="914" x2="600" y2="994" stroke-width="2"/>
      <line class="stroke-acc" x1="600" y1="914" x2="600" y2="994" stroke-width="1" opacity="0.35"/>
      <line class="stroke-div" x1="600" y1="994" x2="600" y2="1074" stroke-width="2"/>
      <line class="stroke-acc" x1="600" y1="994" x2="600" y2="1074" stroke-width="1" opacity="0.35"/>
      <line class="stroke-div" x1="600" y1="1074" x2="600" y2="1154" stroke-width="2"/>
      <line class="stroke-acc" x1="600" y1="1074" x2="600" y2="1154" stroke-width="1" opacity="0.35"/>
      <line class="stroke-div" x1="600" y1="1154" x2="600" y2="1234" stroke-width="2"/>
      <line class="stroke-acc" x1="600" y1="1154" x2="600" y2="1234" stroke-width="1" opacity="0.35"/>

      <line class="stroke-div" x1="600" y1="994" x2="215" y2="994" stroke-width="1.5" opacity="0.8"/>
      <line class="stroke-acc" x1="600" y1="994" x2="215" y2="994" stroke-width="1" opacity="0.2"/>
      <line class="stroke-div" x1="600" y1="994" x2="985" y2="994" stroke-width="1.5" opacity="0.8"/>
      <line class="stroke-acc" x1="600" y1="994" x2="985" y2="994" stroke-width="1" opacity="0.2"/>

      <line class="stroke-div" x1="215" y1="994" x2="215" y2="1074" stroke-width="1.5" opacity="0.8"/>
      <line class="stroke-div" x1="215" y1="1074" x2="215" y2="1154" stroke-width="1.5" opacity="0.8"/>
      <line class="stroke-div" x1="985" y1="994" x2="985" y2="1074" stroke-width="1.5" opacity="0.8"/>

      <line class="stroke-div" x1="215" y1="1154" x2="600" y2="1154" stroke-width="1.5" opacity="0.8"/>
      <line class="stroke-acc" x1="215" y1="1154" x2="600" y2="1154" stroke-width="1" opacity="0.2"/>
    </g>

    <!-- animations: packets -->
