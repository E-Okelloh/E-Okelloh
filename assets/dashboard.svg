      <g class="node pulse-node" style="animation-delay:0.75s">
        <circle class="panel stroke-div" r="22" cx="600" cy="994" stroke-width="1.5"/>
        <circle class="accent" r="4" cx="600" cy="994"/>
      </g>
      <text class="muted" x="600" y="1034">PAYMENT ROUTER</text>

      <g class="node pulse-node" style="animation-delay:1s">
        <circle class="panel stroke-acc" r="24" cx="600" cy="1074" stroke-width="2"/>
