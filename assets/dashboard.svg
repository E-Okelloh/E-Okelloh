      <circle class="packet accent" r="3" cx="600" cy="754"  style="--dx:0px;--dy:80px;--dur:2.8s"/>
      <circle class="packet accent" r="3" cx="600" cy="840"  style="--dx:0px;--dy:74px;--dur:2.2s;animation-delay:0.2s"/>
      <circle class="packet accent" r="3" cx="600" cy="920"  style="--dx:0px;--dy:74px;--dur:2.6s;animation-delay:0.4s"/>
      <circle class="packet accent" r="3" cx="600" cy="994"  style="--dx:0px;--dy:80px;--dur:2.4s;animation-delay:0.1s"/>
      <circle class="packet accent" r="3" cx="600" cy="1074" style="--dx:0px;--dy:80px;--dur:3s;animation-delay:0.5s"/>
      <circle class="packet accent" r="3" cx="600" cy="1154" style="--dx:0px;--dy:80px;--dur:2.6s;animation-delay:0.3s"/>

      <circle class="packet accent" r="3" cx="600" cy="994"  style="--dx:-385px;--dy:0px;--dur:3.2s;animation-delay:0.7s"/>
      <circle class="packet accent" r="3" cx="600" cy="994"  style="--dx:385px;--dy:0px;--dur:2.9s;animation-delay:0.9s"/>
      <circle class="packet accent" r="3" cx="215" cy="1154" style="--dx:385px;--dy:0px;--dur:3.4s;animation-delay:1.1s"/>
    </g>

    <!-- labels & nodes -->
    <g font-size="13" text-anchor="middle">
      <g id="network-node" class="node pulse-node">
        <circle class="panel stroke-div" r="22" cx="600" cy="754" stroke-width="1.5"/>
