      </g>
      <text class="muted" x="985" y="1108" font-size="12">MOBILE MONEY</text>

      <g class="node">
        <circle class="panel stroke-div" r="15" cx="215" cy="1154" stroke-width="1.25"/>
        <circle class="healthy" r="3" cx="215" cy="1154"/>
      </g>
      <text class="muted" x="215" y="1188" font-size="12">BANK APIS</text>
    </g>
  </g>
  <rect class="divider" x="48" y="1308" width="1104" height="1"/>

