      </g>
      <text class="text" x="600" y="1114" font-size="14">PAYMENT ORCHESTRATOR</text>

      <g class="node pulse-node" style="animation-delay:1.25s">
        <circle class="panel stroke-div" r="22" cx="600" cy="1154" stroke-width="1.5"/>
        <circle class="accent" r="4" cx="600" cy="1154"/>
      </g>
      <text class="muted" x="600" y="1194">SETTLEMENT</text>

      <g class="node pulse-node" style="animation-delay:1.5s">
        <circle class="panel stroke-div" r="20" cx="600" cy="1234" stroke-width="1.5"/>
        <circle class="healthy" r="4" cx="600" cy="1234"/>
      </g>
      <text class="muted" x="600" y="1272">LEDGER</text>

      <g class="node">
        <circle class="panel stroke-div" r="15" cx="215" cy="994" stroke-width="1.25"/>
        <circle class="accent" r="3" cx="215" cy="994"/>
      </g>
      <text class="muted" x="215" y="1028" font-size="12">FRAUD ENGINE</text>

      <g class="node">
