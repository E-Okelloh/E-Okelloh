<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" preserveAspectRatio="xMidYMid meet" aria-labelledby="logo-title logo-desc">
  <!--
    Component : logo
    Purpose   : brand mark — hexagonal settlement node
    Author    : Erick Okello
    Version   : 1.3
    Dependencies : none
  -->
  <title id="logo-title">E-Okelloh mark</title>
  <desc id="logo-desc">Hexagonal node mark representing the financial settlement network.</desc>
  <style>
    :root {
      --bg: #050816;
      --panel: #0B1020;
      --divider: #1D2638;
      --accent: #00F5FF;
      --text: #F5F7FA;
      --font: 'JetBrains Mono', 'IBM Plex Mono', monospace;
    }
    svg { font-family: var(--font); }

    .panel  { fill: var(--panel); }
    .divider{ fill: var(--divider); }
    .accent { fill: var(--accent); }
    .text   { fill: var(--text); }
    .stroke { stroke: var(--accent); }
  </style>

  <rect class="panel" x="1" y="1" width="62" height="62" rx="14"/>
  <path class="stroke" d="M32 12 L52 22 V42 L32 52 L12 42 V22 Z" fill="none" stroke-width="2"/>
  <circle class="text" cx="21" cy="25" r="3"/>
  <circle class="text" cx="43" cy="39" r="3"/>
  <circle class="accent" cx="32" cy="32" r="4"/>
</svg>